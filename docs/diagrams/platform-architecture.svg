<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-architecture-title platform-architecture-desc" id="platform-architecture-root">
        <title id="platform-architecture-title">Unified API Gateway and Edge CDN Topology</title>
        <desc id="platform-architecture-desc">Architecture diagram showing clients routing through Caddy Gateway into Railway private mesh services and PostgreSQL, alongside Cloudflare CDN Worker and R2 storage.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #platform-architecture-root { --color-paper:   #0c0c14;
      --color-paper-2: #15151f;
      --color-ink:     #e8e9ff;
      --color-muted:   #a8a8c3;
      --color-soft:    #8d8da1;
      --color-accent:  #aaa8ee;
      --color-link:    #6dbbe8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #platform-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #platform-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#platform-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="platform-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8a8c3"/></marker>
          <marker id="platform-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#aaa8ee"/></marker>
          <marker id="platform-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6dbbe8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0c0c14"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="40" y="144" width="596" height="364" rx="8"
              fill="#e8e9ff" stroke="#2c2c3c" stroke-width="0.8" fill-opacity="0.02"/>
        <rect x="172" y="148" width="144" height="12" rx="2" fill="#0c0c14"/>
        <text x="244" y="157" fill="#8d8da1" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">RAILWAY PRIVATE MESH</text>

        <rect x="668" y="144" width="252" height="364" rx="8"
              fill="#e8e9ff" stroke="#2c2c3c" stroke-width="0.8" fill-opacity="0.02"/>
        <rect x="676" y="148" width="108" height="12" rx="2" fill="#0c0c14"/>
        <text x="730" y="157" fill="#8d8da1" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE EDGE</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Clients -> Caddy Gateway -->
        <line x1="184" y1="72" x2="252" y2="72" stroke="#6dbbe8" stroke-width="1.2" marker-end="url(#platform-architecture-arrow-link)"/>

        <!-- Caddy Gateway -> CDN Worker (single-bend L-path) -->
        <path d="M 432,72 H 788 Q 796,72 796,80 V 184"
              fill="none" stroke="#aaa8ee" stroke-width="1.4" marker-end="url(#platform-architecture-arrow-accent)"/>

        <!-- Caddy Gateway -> Core, Hasura & Health, Media (fanned bottom ports: 292, 340, 388) -->
        <path d="M 292,104 V 124 Q 292,132 284,132 H 152 Q 144,132 144,140 V 184"
              fill="none" stroke="#aaa8ee" stroke-width="1.2" marker-end="url(#platform-architecture-arrow-accent)"/>
        <line x1="340" y1="104" x2="340" y2="184" stroke="#a8a8c3" stroke-width="1.2" marker-end="url(#platform-architecture-arrow)"/>
        <path d="M 388,104 V 124 Q 388,132 396,132 H 524 Q 532,132 532,140 V 184"
              fill="none" stroke="#aaa8ee" stroke-width="1.2" marker-end="url(#platform-architecture-arrow-accent)"/>

        <!-- Core, Hasura & Health, Media -> PostgreSQL 16 (fanned PG top ports: 224, 340, 456) -->
        <path d="M 144,244 V 324 Q 144,332 152,332 H 216 Q 224,332 224,340 V 412"
              fill="none" stroke="#a8a8c3" stroke-width="1.2" marker-end="url(#platform-architecture-arrow)"/>
        <line x1="340" y1="244" x2="340" y2="412" stroke="#a8a8c3" stroke-width="1.2" marker-end="url(#platform-architecture-arrow)"/>
        <path d="M 508,244 V 324 Q 508,332 500,332 H 464 Q 456,332 456,340 V 412"
              fill="none" stroke="#a8a8c3" stroke-width="1.2" marker-end="url(#platform-architecture-arrow)"/>

        <!-- Media Service -> CDN Worker (dashed Cache Purge API) -->
        <line x1="616" y1="212" x2="692" y2="212" stroke="#a8a8c3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#platform-architecture-arrow)"/>

        <!-- Media Service -> Cloudflare R2 (L-path from fanned bottom port 576) -->
        <path d="M 576,244 V 432 Q 576,440 584,440 H 692"
              fill="none" stroke="#6dbbe8" stroke-width="1.2" marker-end="url(#platform-architecture-arrow-link)"/>

