# Optional local/self-hosted imgproxy for on-the-fly /img/* image transforms.
# Core API, Media Service, Hasura, and Gateway live in https://github.com/WomB0ComB0/api.

services:
  imgproxy:
    image: darthsim/imgproxy:v3.21
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${R2_ENDPOINT:-}
      IMGPROXY_S3_REGION: auto
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_GZIP_COMPRESSION: "6"
      IMGPROXY_MAX_SRC_FILE_SIZE: "52428800"
      IMGPROXY_ALLOWED_SOURCES: s3://${R2_BUCKET_NAME:-cdn}
      IMGPROXY_CACHE_CONTROL_PASSTHROUGH: "true"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
