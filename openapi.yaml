openapi: 3.1.0
info:
  title: cdn.mikeodnis.dev — Edge CDN & Media Delivery
  version: 2.0.0
  description: >
    Global edge delivery worker for public immutable R2 assets, HMAC-SHA256 signed private assets,
    and on-the-fly raster-only imgproxy image transformations. Uploads and management live at
    https://api.mikeodnis.dev/v1/media.
  contact:
    name: Mike Odnis
    url: https://mikeodnis.dev
    email: mike@mikeodnis.dev
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://cdn.mikeodnis.dev
    description: Edge Delivery (Cloudflare Workers + R2)
  - url: https://api.mikeodnis.dev/v1/media
    description: Media Upload & Management API
paths:
  /:
    get:
      summary: CDN overview (HTML Live Console or JSON descriptor)
      tags: [Discovery]
      responses:
        '200':
          description: Service overview
  /health:
    get:
      summary: Edge worker liveness probe (no-store, nosniff)
      tags: [Health]
      responses:
        '200':
          description: Healthy
  /health/metrics:
    get:
      summary: Edge worker health and rate-limiter counters (no-store, nosniff)
      tags: [Health]
      responses:
        '200':
          description: Health and rate-limit metrics
  /assets/{key}:
    get:
      summary: Fetch public immutable R2 asset (canonical query-stripped edge cache)
      tags: [Delivery]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { description: Asset content (SVG/HTML/XML sandboxed; active/zip/opaque attachment) }
        '206': { description: Partial byte range }
        '304': { description: Not Modified }
        '404': { description: Asset not found }
        '429': { description: Rate limit exceeded (300/60s per visitor) }
  /private/{key}:
    get:
      summary: Fetch HMAC-SHA256 signed private asset (CDN-Cache-Control no-store, no-referrer, noindex)
      tags: [Delivery]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: exp
          in: query
          required: true
          schema: { type: integer }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Private asset content }
        '403': { description: Missing, invalid, or expired HMAC signature }
        '404': { description: Asset not found }
        '429': { description: Rate limit exceeded (120/60s per visitor) }
  /img/assets/{key}:
    get:
      summary: On-the-fly resized and re-encoded public raster image
      tags: [Transforms]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: w
          in: query
          schema: { type: integer, minimum: 0, maximum: 4096 }
        - name: h
          in: query
          schema: { type: integer, minimum: 0, maximum: 4096 }
        - name: q
          in: query
          schema: { type: integer, minimum: 10, maximum: 100, default: 85 }
        - name: f
          in: query
          schema: { type: string, enum: [webp, avif, jpg, jpeg, png], default: webp }
      responses:
        '200': { description: Transformed raster image }
        '403': { description: Non-assets/* transforms forbidden }
        '415': { description: Unsupported non-raster source format }
        '429': { description: Rate limit exceeded (60/60s per visitor) }
        '502': { description: Upstream image proxy error or invalid content type }
        '503': { description: Image proxy not configured }
        '504': { description: Image proxy timed out }
  /llms.txt:
    get:
      summary: Concise LLM documentation index
      tags: [Discovery]
      responses:
        '200': { description: Markdown summary }
  /llms-full.txt:
    get:
      summary: Full LLM technical reference
      tags: [Discovery]
      responses:
        '200': { description: Full Markdown reference }
