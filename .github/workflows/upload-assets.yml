name: Upload Static Assets to R2

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-static-assets
  cancel-in-progress: false

jobs:
  upload-assets:
    name: Generate Manifest & Upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install script dependencies
        working-directory: ./scripts
        run: bun install --frozen-lockfile

      - name: Generate asset manifest with content hashes
        run: |
          bun scripts/generate-asset-manifest.ts > asset-manifest.json
          cat asset-manifest.json

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'cdn' }}
        run: bun scripts/upload-to-r2.ts

      - name: Purge Cloudflare Zone Cache (when Cloudflare DNS zone is configured)
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Skipping zone cache purge (CLOUDFLARE_ZONE_ID not configured)"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-manifest
          path: asset-manifest.json
          retention-days: 30
