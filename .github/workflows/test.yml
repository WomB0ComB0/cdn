name: Tests and Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-worker:
    name: Typecheck, Unit & Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./cloudflare-worker
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        working-directory: ./cloudflare-worker
        run: bun run typecheck

      - name: Run tests (including Hexagonal boundary checks)
        working-directory: ./cloudflare-worker
        run: bun test

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose --env-file .env.example config -q

  security-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Audit Worker dependencies
        working-directory: ./cloudflare-worker
        run: |
          bun install --frozen-lockfile || bun install
          bun audit --audit-level=high
