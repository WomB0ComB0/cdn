name: CI & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-ci:
    name: Typecheck, Test & Bundle Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./cloudflare-worker
        run: bun install --frozen-lockfile

      - name: Strict TypeScript typecheck (Worker + Scripts)
        run: |
          (cd cloudflare-worker && bun run typecheck)
          (cd scripts && bun install --frozen-lockfile && bun run typecheck)

      - name: Run unit, scripts & Hexagonal boundary tests
        run: |
          (cd cloudflare-worker && bun test)
          (cd scripts && bun test)

      - name: Verify Cloudflare Worker bundle (dry-run)
        working-directory: ./cloudflare-worker
        run: |
          OUT=$(bunx wrangler deploy --dry-run 2>&1)
          echo "$OUT"
          SIZE=$(echo "$OUT" | grep -i "Total Upload:" || echo "Bundle verified")
          {
            echo "### CDN Worker CI"
            echo "- Typecheck: passed"
            echo "- Unit + Hexagonal boundary tests: passed"
            echo "- $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"

  security-audit:
    name: Dependency, Workflow & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit Worker & Scripts dependencies
        run: |
          (cd cloudflare-worker && bun install --frozen-lockfile && bun audit --audit-level=high)
          (cd scripts && bun install --frozen-lockfile && bun audit --audit-level=high)

      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          strict-collection: true
          advanced-security: false
          annotations: true

      - name: Ensure no .env or key files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "::error::Sensitive file committed to git!"
            exit 1
          fi

  validate-compose:
    name: Validate imgproxy Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose config
        run: docker compose --env-file .env.example config -q
