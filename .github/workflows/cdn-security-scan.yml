name: Continuous CDN R2 Security Scan

on:
  schedule:
    - cron: '23 4 * * *' # Nightly 04:23 UTC retroactive audit
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan all objects without quarantining or purging cache
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cdn-security-scan
  cancel-in-progress: false

jobs:
  scan-r2:
    name: Retroactive R2 Security Audit (ClamAV + Static + MalwareBazaar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install ClamAV & refresh malware signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || true

      - name: Install script dependencies
        working-directory: ./scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run retroactive R2 bucket security scan
        working-directory: ./scripts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'cdn' }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "R2 credentials not configured in repository secrets; skipping live bucket scan."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            bun scan-r2-bucket.ts --dry-run --report=../r2-security-report.json --fail-on-findings
          else
            bun scan-r2-bucket.ts --quarantine --purge-cache --report=../r2-security-report.json --fail-on-findings
          fi

      - name: Upload security scan report artifact
        if: always() && hashFiles('r2-security-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r2-security-report
          path: r2-security-report.json
          retention-days: 30
